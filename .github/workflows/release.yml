        name: Check out reviewed release merge
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - if: ${{ steps.action-runtime-bootstrap.outcome == 'success' && steps.package-manager-client.outcome == 'success' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - if: ${{ steps.action-runtime-bootstrap.outcome == 'success' && steps.package-manager-client.outcome == 'success' }}
        name: Check the actual Node security policy
        run: node scripts/check-node-security.mjs
      - if: ${{ steps.action-runtime-bootstrap.outcome == 'success' && steps.package-manager-client.outcome == 'success' }}
        run: npm run security:check && npm ci

      - if: ${{ steps.action-runtime-bootstrap.outcome == 'success' && steps.package-manager-client.outcome == 'success' }}
        name: Validate reviewed merge before release creation
        env:
          SOURCE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          if [[ "${SOURCE_SHA}" != "${GITHUB_SHA}" ]]; then
            echo "The reviewed merge differs from the workflow source; refusing mismatched publication provenance." >&2
            exit 1
          fi
          node scripts/verify-release-checkpoint.mjs \
            --phase publish --release-branch main --source-sha "$SOURCE_SHA"

      - if: ${{ steps.action-runtime-bootstrap.outcome == 'success' && steps.package-manager-client.outcome == 'success' }}
        name: Validate finalized notes before release creation
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PR: ${{ github.event.pull_request.number }}
          SOURCE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          node scripts/release-notes.mjs publication --repository "$GH_REPO" \
            --source "$SOURCE_SHA" --pr "$RELEASE_PR"

      - if: ${{ steps.action-runtime-bootstrap.outcome == 'success' && steps.package-manager-client.outcome == 'success' }}
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
