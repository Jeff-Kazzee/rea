            if (-not $workerPath -or -not [IO.Path]::IsPathFullyQualified($workerPath) -or [IO.Path]::GetFileName($workerPath) -cne $workerName) { throw 'CI_UNSUPPORTED_ACTION_RUNTIME: unreadable native worker path.' }
